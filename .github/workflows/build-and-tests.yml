# =============================================================================
# Planning Poker - Build and Tests
# =============================================================================
# develop / release ブランチへのプッシュと、これらのブランチへの PR で
# ビルドとテストを実行します。デプロイは deploy-to-firebase.yml が
# v* タグで実行します。
# =============================================================================

name: Build and Tests

on:
  push:
    branches:
      - develop
      - release
  pull_request:
    branches:
      - develop
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Run lint
        run: yarn lint
        env:
          CI: true
      - name: Run tests
        run: yarn test
        env:
          CI: true
